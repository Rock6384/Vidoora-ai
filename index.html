<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vidoora AI - Video Generator</title>
<style>
body{margin:0;background:#070a12;color:#f5f7ff;font-family:system-ui,Arial;padding-bottom:50px}
.wrap{max-width:850px;margin:auto;padding:20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:10px 0 25px}
.logo{font-size:24px;font-weight:800}.logo i{color:#8b7cff;font-style:normal}
h1{text-align:center;font-size:clamp(28px,5vw,46px);line-height:1.15;margin:0}
.grad{color:#8b7cff}
.sub{text-align:center;color:#9ba5bb;max-width:620px;margin:12px auto 25px;font-size:15px}
.card{background:#101523;border:1px solid #273047;border-radius:18px;padding:20px}
textarea{width:100%;height:100px;box-sizing:border-box;background:#090e19;color:white;border:1px solid #303a52;border-radius:12px;padding:12px;font-size:15px;resize:vertical}
.controls{display:flex;gap:10px;margin-top:12px}
button{width:100%;padding:14px;border-radius:10px;font-size:16px;border:0;background:#8b7cff;color:white;font-weight:700;cursor:pointer;transition:0.2s}
button:hover{background:#7968ff}
button:disabled{background:#334155;cursor:not-allowed}

#box{display:none;margin-top:20px;padding:16px;background:#0a1020;border-radius:14px;border:1px solid #1e283d}
.bar{height:8px;background:#202a40;border-radius:8px;overflow:hidden;margin:12px 0}
.fill{height:100%;width:0;background:#22c55e;transition:width 0.3s ease}
#status{font-size:14px;color:#cbd5e1}

#videoResult{display:none;margin-top:20px;text-align:center;background:#0d1322;padding:16px;border-radius:16px;border:1px solid #273047}
video{width:100%;max-width:640px;border-radius:10px;margin:12px auto;display:block;background:#000}
.dl-btn{display:inline-block;background:#22c55e;color:white;padding:12px 24px;border-radius:8px;font-weight:bold;font-size:15px;text-decoration:none;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="logo">Vidoora <i>AI</i></div>
    <small style="color:#22c55e;">● Server Active</small>
  </nav>
  <h1>One Prompt.<br><span class="grad">Full AI Video Creation.</span></h1>
  <p class="sub">AI cinematic storyboard video generate karein bina kisi paid API key ke.</p>
  
  <div class="card">
    <textarea id="p" placeholder="Apna prompt likhein (jaise: A thirsty crow searching for water in a sunny desert, cinematic realistic lighting)..."></textarea>
    
    <div class="controls">
      <button id="genBtn" onclick="generateVideo()">✨ Generate Full Video</button>
    </div>

    <div id="box">
      <div style="display:flex;justify-content:space-between;">
        <b id="status">Starting AI generator...</b>
        <span id="pct" style="color:#22c55e;font-weight:bold;">0%</span>
      </div>
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>

      <div id="videoResult">
        <h3 style="margin:0 0 10px 0;color:#22c55e;">🎉 Video Ban Chuki Hai!</h3>
        <video id="vPlayer" controls playsinline loop></video>
        <div>
          <a id="dlLink" class="dl-btn" href="#" download="Vidoora_AI_Video.webm">⬇ Download Video File</a>
        </div>
      </div>
    </div>
  </div>
</div>

<canvas id="renderCanvas" width="1280" height="720" style="display:none;"></canvas>

<script>
async function generateVideo() {
  const prompt = p.value.trim();
  if(!prompt) {
    alert("Kripya ek prompt likhein.");
    return;
  }

  const btn = document.getElementById("genBtn");
  btn.disabled = true;
  box.style.display = "block";
  videoResult.style.display = "none";
  updateProgress(10, "Story scenes plan ho rahe hain...");

  // 4 Scenes storyboard prompts
  const scenes = [
    `${prompt}, establishing cinematic landscape shot, wide angle, 8k ultra-detailed`,
    `${prompt}, main subject in focus, detailed motion, photorealistic`,
    `${prompt}, dramatic angle, hyper-realistic, dynamic lighting`,
    `${prompt}, closing cinematic frame, masterpiece award winning`
  ];

  updateProgress(25, "AI visual frames generate kar raha hai...");

  const loadedImages = [];
  try {
    for (let i = 0; i < scenes.length; i++) {
      const seed = Math.floor(Math.random() * 900000) + 100000;
      const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scenes[i])}?width=1280&height=720&nologo=true&seed=${seed}`;
      const img = await loadImage(imgUrl);
      loadedImages.push(img);
      updateProgress(25 + ((i + 1) * 12), `Scene ${i + 1} of 4 render ho gaya...`);
    }

    updateProgress(80, "MP4/WebM video file compile ki ja rahi hai...");
    const videoBlob = await recordScenesToVideo(loadedImages);
    const videoUrl = URL.createObjectURL(videoBlob);

    updateProgress(100, "✅ Video Taiyar Hai!");
    const player = document.getElementById("vPlayer");
    player.src = videoUrl;
    player.play();

    const dl = document.getElementById("dlLink");
    dl.href = videoUrl;

    videoResult.style.display = "block";
  } catch(err) {
    updateProgress(100, "❌ Error: " + err.message);
  } finally {
    btn.disabled = false;
  }
}

function updateProgress(pctVal, text) {
  fill.style.width = pctVal + "%";
  pct.textContent = pctVal + "%";
  status.textContent = text;
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Image frame load nahi ho paya"));
    img.src = url;
  });
}

function recordScenesToVideo(images) {
  return new Promise((resolve) => {
    const canvas = document.getElementById("renderCanvas");
    const ctx = canvas.getContext("2d");
    const stream = canvas.captureStream(30);

    let recorder;
    try {
      recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
    } catch(e) {
      recorder = new MediaRecorder(stream);
    }

    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      resolve(new Blob(chunks, { type: 'video/webm' }));
    };

    recorder.start();

    const sceneDuration = 2000; // 2 seconds per scene
    const totalDuration = sceneDuration * images.length;
    const startTime = performance.now();

    function renderLoop(currentTime) {
      const elapsed = currentTime - startTime;
      if (elapsed >= totalDuration) {
        recorder.stop();
        return;
      }

      const currentIdx = Math.min(Math.floor(elapsed / sceneDuration), images.length - 1);
      const sceneElapsed = (elapsed % sceneDuration) / sceneDuration;
      const img = images[currentIdx];

      // Dynamic cinematic camera motion (Ken Burns effect)
      const scale = 1.0 + (sceneElapsed * 0.15);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(scale, scale);
      ctx.drawImage(img, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
      ctx.restore();

      // Scene indicator watermark
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(20, canvas.height - 50, 180, 32);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 16px system-ui";
      ctx.fillText(`Scene ${currentIdx + 1} / ${images.length}`, 35, canvas.height - 28);

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);
  });
}
</script>
</body>
  </html>
