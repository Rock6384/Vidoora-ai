<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vidoora AI</title>
<style>
body{margin:0;background:#070a12;color:#f5f7ff;font-family:system-ui,Arial}.wrap{max-width:900px;margin:auto;padding:24px}
nav{display:flex;justify-content:space-between;padding:10px 0 50px}.logo{font-size:25px;font-weight:800}.logo i{color:#8b7cff;font-style:normal}
h1{text-align:center;font-size:clamp(40px,8vw,72px);line-height:1;margin:0}.grad{color:#8b7cff}
.sub{text-align:center;color:#9ba5bb;max-width:650px;margin:20px auto 35px;font-size:18px}
.card{background:#101523;border:1px solid #273047;border-radius:22px;padding:20px}
textarea{width:100%;height:150px;box-sizing:border-box;background:#090e19;color:white;border:1px solid #303a52;border-radius:15px;padding:16px;font-size:16px}
.controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}select,button{padding:13px;border-radius:12px;font-size:15px}select{background:#090e19;color:white;border:1px solid #303a52;flex:1}button{border:0;background:#8b7cff;color:white;font-weight:700;flex:2}
#box{display:none;margin-top:18px;padding:16px;background:#0a1020;border-radius:14px}.bar{height:9px;background:#202a40;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:#8b7cff;transition:.3s}
.scene{padding:9px 0;border-bottom:1px solid #20283a;color:#aeb7c9;font-size:13px}
small{color:#77839a}
</style></head><body><div class="wrap">
<nav><div class="logo">Vidoora <i>AI</i></div><small>Free prototype</small></nav>
<h1>One Prompt.<br><span class="grad">One Complete Video.</span></h1>
<p class="sub">Create a long-form video plan from one prompt. This prototype is ready for the real video API connection.</p>
<div class="card">
<textarea id="p" placeholder="Example: Make an 8-minute Hindi documentary about Chandrayaan-3, cinematic and educational..."></textarea>
<div class="controls">
<select id="l"><option>Hindi</option><option>English</option><option>Hinglish</option></select>
<select id="d"><option>5 minutes</option><option>8 minutes</option><option>10 minutes</option></select>
<select id="a"><option>16:9</option><option>9:16</option></select>
<button onclick="go()">✨ Generate Video</button></div>
<div id="box"><b id="status">Starting...</b><p><div class="bar"><div class="fill" id="fill"></div></div></p><div id="scenes"></div></div>
</div></div>
<script>
async function go(){
 const prompt=p.value.trim(); if(!prompt){alert("Please enter a prompt.");return}
 box.style.display="block"; scenes.innerHTML="";
 const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,language:l.value,duration:d.value,aspectRatio:a.value})});
 if(!r.ok){status.textContent="Could not start job";return}
 const {jobId}=await r.json(); poll(jobId);
}
async function poll(id){
 const j=await fetch("/api/jobs/"+id).then(x=>x.json());
 fill.style.width=j.progress+"%"; status.textContent=j.status.replaceAll("_"," ").toUpperCase()+" — "+j.progress+"%";
 if(j.scenes?.length) scenes.innerHTML=j.scenes.map(s=>`<div class="scene">Scene ${s.scene}: ${s.prompt}</div>`).join("");
 if(j.status!=="completed") setTimeout(()=>poll(id),900);
 else status.textContent="✅ Demo completed — connect a video API for the real MP4.";
}
</script></body></html>
