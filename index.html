<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vidoora AI</title>
<style>
body{margin:0;background:#070a12;color:#f5f7ff;font-family:system-ui,Arial}
.wrap{max-width:900px;margin:auto;padding:24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:10px 0 40px}
.logo{font-size:25px;font-weight:800}.logo i{color:#8b7cff;font-style:normal}
h1{text-align:center;font-size:clamp(32px,6vw,56px);line-height:1.1;margin:0}
.grad{color:#8b7cff}
.sub{text-align:center;color:#9ba5bb;max-width:650px;margin:15px auto 30px;font-size:16px}
.card{background:#101523;border:1px solid #273047;border-radius:22px;padding:22px}
textarea{width:100%;height:120px;box-sizing:border-box;background:#090e19;color:white;border:1px solid #303a52;border-radius:15px;padding:14px;font-size:15px;resize:vertical}
.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
select,button{padding:12px;border-radius:12px;font-size:15px}
select{background:#090e19;color:white;border:1px solid #303a52;flex:1}
button{border:0;background:#8b7cff;color:white;font-weight:700;flex:2;cursor:pointer}
button:hover{background:#7968ff}
#box{display:none;margin-top:20px;padding:18px;background:#0a1020;border-radius:14px;border:1px solid #1e283d}
.bar{height:10px;background:#202a40;border-radius:10px;overflow:hidden;margin:12px 0}
.fill{height:100%;width:0;background:#22c55e;transition:width 0.3s ease}
#status{font-size:15px;color:#cbd5e1}

/* Real AI Motion Video Player */
#videoResult{display:none;margin-top:20px;text-align:center;background:#0d1322;padding:16px;border-radius:16px;border:1px solid #273047}
.canvas-wrap{position:relative;width:100%;max-width:640px;margin:12px auto;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
canvas{width:100%;display:block;aspect-ratio:16/9}
.player-controls{display:flex;justify-content:center;gap:15px;margin-top:10px}
.p-btn{background:#8b7cff;border:none;color:white;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer}

#scenes{max-height:220px;overflow-y:auto;margin-top:18px;padding-right:8px}
.scene{padding:10px;margin-bottom:8px;background:#131b2e;border-radius:8px;border-left:3px solid #8b7cff;color:#cbd5e1;font-size:13px;line-height:1.4}
small{color:#77839a}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="logo">Vidoora <i>AI</i></div>
    <small>Free AI Generator</small>
  </nav>
  <h1>One Prompt.<br><span class="grad">Real Video Generated.</span></h1>
  <p class="sub">100% Free AI video creator — prompt ke hisab se exact matching visual video.</p>
  
  <div class="card">
    <textarea id="p" placeholder="Apna prompt yahan likhein (jaise: ek pyasa kauwa jungle me ghade me kankad daal raha hai)..."></textarea>
    
    <div class="controls">
      <select id="l">
        <option>Hindi</option>
        <option>English</option>
      </select>
      <select id="d">
        <option>5 scenes</option>
        <option>8 scenes</option>
      </select>
      <button onclick="go()">✨ Generate Video</button>
    </div>

    <div id="box">
      <div style="display:flex;justify-content:space-between;">
        <b id="status">AI video render ho rahi hai...</b>
        <span id="pct" style="color:#22c55e;font-weight:bold;">0%</span>
      </div>
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>

      <!-- Real AI Canvas Video Player -->
      <div id="videoResult">
        <h3 style="margin:0 0 10px 0;color:#22c55e;">🎉 Aapki Video Ready Hai!</h3>
        <div class="canvas-wrap">
          <canvas id="vCanvas" width="1280" height="720"></canvas>
        </div>
        <div class="player-controls">
          <button class="p-btn" onclick="togglePlay()" id="playBtn">⏸ Pause Video</button>
          <button class="p-btn" style="background:#22c55e;" onclick="restartVideo()">🔄 Replay</button>
        </div>
      </div>

      <div id="scenes"></div>
    </div>
  </div>
</div>

<script>
let sceneImages = [];
let animFrame = null;
let isPlaying = false;
let currentSceneIndex = 0;
let sceneProgress = 0;

async function go(){
  const prompt = p.value.trim();
  if(!prompt){
    alert("Please enter a prompt.");
    return;
  }
  
  box.style.display = "block";
  videoResult.style.display = "none";
  scenes.innerHTML = "";
  fill.style.width = "10%";
  pct.textContent = "10%";
  status.textContent = "AI prompt analyze kar raha hai...";

  // Create scenes tailored to prompt
  const sceneDescriptions = [
    `${prompt}, cinematic establishing wide shot, photorealistic 8k`,
    `${prompt}, dramatic close-up, high detailed cinematic film still`,
    `${prompt}, action shot, motion blur, hyper realistic photography`,
    `${prompt}, emotional climax scene, dynamic studio lighting 4k`
  ];

  sceneImages = [];
  status.textContent = "AI video frames generate kar raha hai (Free AI)...";
  
  let loaded = 0;
  for(let i=0; i<sceneDescriptions.length; i++){
    const img = new Image();
    img.crossOrigin = "anonymous";
    const encoded = encodeURIComponent(sceneDescriptions[i]);
    img.src = `https://image.pollinations.ai/prompt/${encoded}?width=1280&height=720&nologo=true&seed=${Math.floor(Math.random()*999999)}`;
    
    img.onload = () => {
      loaded++;
      const pVal = Math.floor((loaded / sceneDescriptions.length) * 90);
      fill.style.width = pVal + "%";
      pct.textContent = pVal + "%";
      if(loaded === sceneDescriptions.length){
        finishGeneration(prompt, sceneDescriptions);
      }
    };
    img.onerror = () => {
      loaded++;
      if(loaded === sceneDescriptions.length){
        finishGeneration(prompt, sceneDescriptions);
      }
    };
    sceneImages.push({ img, text: `Scene ${i+1}: ${sceneDescriptions[i].substring(0, 60)}...` });
  }
}

function finishGeneration(userPrompt, descList){
  fill.style.width = "100%";
  pct.textContent = "100%";
  status.textContent = "✅ Generation Complete!";
  videoResult.style.display = "block";

  scenes.innerHTML = descList.map((d, i) => `
    <div class="scene">
      <b>Scene ${i+1}:</b> ${d}
    </div>
  `).join("");

  startVideoPlayer();
}

function startVideoPlayer(){
  currentSceneIndex = 0;
  sceneProgress = 0;
  isPlaying = true;
  document.getElementById("playBtn").textContent = "⏸ Pause Video";
  renderLoop();
}

function renderLoop(){
  if(!isPlaying) return;
  const canvas = document.getElementById("vCanvas");
  const ctx = canvas.getContext("2d");
  
  const current = sceneImages[currentSceneIndex];
  if(current && current.img.complete && current.img.naturalWidth > 0){
    // Cinematic Zoom & Pan Motion Effect (Ken Burns Video Effect)
    const scale = 1.0 + (sceneProgress * 0.15);
    const w = canvas.width;
    const h = canvas.height;
    
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.scale(scale, scale);
    ctx.drawImage(current.img, -w/2, -h/2, w, h);
    ctx.restore();

    // Scene Label Overlay
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(20, h - 70, w - 40, 50);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 24px system-ui";
    ctx.fillText(`Scene ${currentSceneIndex + 1}/${sceneImages.length}`, 40, h - 36);
  }

  sceneProgress += 0.006; // Video frame speed
  if(sceneProgress >= 1){
    sceneProgress = 0;
    currentSceneIndex = (currentSceneIndex + 1) % sceneImages.length;
  }

  animFrame = requestAnimationFrame(renderLoop);
}

function togglePlay(){
  isPlaying = !isPlaying;
  document.getElementById("playBtn").textContent = isPlaying ? "⏸ Pause Video" : "▶ Play Video";
  if(isPlaying) renderLoop();
}

function restartVideo(){
  currentSceneIndex = 0;
  sceneProgress = 0;
  isPlaying = true;
  document.getElementById("playBtn").textContent = "⏸ Pause Video";
  renderLoop();
}
</script>
</body>
            </html>
