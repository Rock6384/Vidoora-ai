<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vidoora AI</title>
<style>
body{margin:0;background:#070a12;color:#f5f7ff;font-family:system-ui,Arial}
.wrap{max-width:850px;margin:auto;padding:24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:10px 0 40px}
.logo{font-size:25px;font-weight:800}.logo i{color:#8b7cff;font-style:normal}
h1{text-align:center;font-size:clamp(32px,6vw,56px);line-height:1.1;margin:0}
.grad{color:#8b7cff}
.sub{text-align:center;color:#9ba5bb;max-width:650px;margin:15px auto 30px;font-size:16px}
.card{background:#101523;border:1px solid #273047;border-radius:22px;padding:22px}
textarea{width:100%;height:120px;box-sizing:border-box;background:#090e19;color:white;border:1px solid #303a52;border-radius:15px;padding:14px;font-size:15px;resize:vertical}
.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
select,button{padding:12px;border-radius:12px;font-size:15px}
select{background:#090e19;color:white;border:1px solid #303a52;flex:1}
button{border:0;background:#8b7cff;color:white;font-weight:700;flex:2;cursor:pointer}
button:hover{background:#7968ff}
#box{display:none;margin-top:20px;padding:18px;background:#0a1020;border-radius:14px;border:1px solid #1e283d}
.bar{height:10px;background:#202a40;border-radius:10px;overflow:hidden;margin:12px 0}
.fill{height:100%;width:0;background:#22c55e;transition:width 0.4s ease}
#status{font-size:15px;color:#cbd5e1}

#videoResult{display:none;margin-top:20px;text-align:center;background:#0d1322;padding:16px;border-radius:16px;border:1px solid #273047}
video{width:100%;max-width:640px;border-radius:12px;margin:12px auto;display:block;background:#000}
.dl-btn{display:inline-block;background:#22c55e;color:white;padding:12px 24px;border-radius:8px;font-weight:bold;font-size:15px;text-decoration:none;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="logo">Vidoora <i>AI</i></div>
    <small>AI Text-to-Video Mode</small>
  </nav>
  <h1>One Prompt.<br><span class="grad">Real AI Video.</span></h1>
  <p class="sub">Replicate AI GPU engine se direct real MP4 video generate karein.</p>
  
  <div class="card">
    <textarea id="p" placeholder="Apna prompt yahan likhein (jaise: A thirsty crow drinking water from a pitcher, realistic cinematic footage)..."></textarea>
    
    <div class="controls">
      <select id="l">
        <option>English / Hindi Prompt</option>
      </select>
      <button onclick="go()">✨ Generate Real Video</button>
    </div>

    <div id="box">
      <div style="display:flex;justify-content:space-between;">
        <b id="status">Connecting to AI GPU...</b>
        <span id="pct" style="color:#22c55e;font-weight:bold;">0%</span>
      </div>
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>

      <!-- Real AI MP4 Video Player -->
      <div id="videoResult">
        <h3 style="margin:0 0 10px 0;color:#22c55e;">🎉 Real AI Video Ready!</h3>
        <video id="vPlayer" controls playsinline autoplay loop></video>
        <div>
          <a id="dlLink" class="dl-btn" href="#" target="_blank" download="Vidoora_AI_Video.mp4">⬇ Download Video (MP4)</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
async function go(){
  const prompt = p.value.trim();
  if(!prompt){
    alert("Please enter a prompt.");
    return;
  }
  
  box.style.display = "block";
  videoResult.style.display = "none";
  fill.style.width = "10%";
  pct.textContent = "10%";
  status.textContent = "Replicate AI ko job bhej rahe hain...";

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });

    if(!res.ok){
      status.textContent = "Error: Job start nahi hua.";
      return;
    }

    const { jobId } = await res.json();
    poll(jobId);
  } catch(e) {
    status.textContent = "Network error while connecting.";
  }
}

async function poll(id){
  try {
    const res = await fetch("/api/jobs/" + id);
    if(!res.ok) return;
    const j = await res.json();

    fill.style.width = j.progress + "%";
    pct.textContent = j.progress + "%";

    if(j.status === "failed"){
      status.textContent = "❌ Error: " + (j.error || "Generation fail ho gaya");
      return;
    }

    status.textContent = (j.status || "").replace(/_/g, " ").toUpperCase() + " (GPU Rendering)...";

    if(j.status === "completed" && j.videoUrl){
      fill.style.width = "100%";
      pct.textContent = "100%";
      status.textContent = "✅ Real AI Video Generated!";

      const player = document.getElementById("vPlayer");
      player.src = j.videoUrl;
      document.getElementById("dlLink").href = j.videoUrl;
      videoResult.style.display = "block";
      player.play();
    } else {
      setTimeout(() => poll(id), 3000);
    }
  } catch(e) {
    setTimeout(() => poll(id), 3500);
  }
}
</script>
</body>
  </html>
